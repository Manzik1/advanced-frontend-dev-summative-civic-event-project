<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — CivicEvents</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<!--
  ======================================================================
  PUBLIC PAGE — No Authentication Guard Required
  ======================================================================
  This is a PUBLIC login page. It does NOT call Auth.requireAuth()
  because unauthenticated users must be able to access it.

  ROLE-BASED ACCESS CONTROL NOTES:
  - The POST /auth/login endpoint returns the user's role (admin or user)
    as part of the user object. The role is stored via Auth.setUser().
  - Only the BACKEND can assign the "admin" role. There is no way to
    elevate privileges from the frontend.
  - If a user is ALREADY logged in, they are redirected to the dashboard
    immediately (no need to log in again).
  ======================================================================
-->
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#4A2E18] via-[#7B4B28] to-[#D4A373]">

    <!-- Decorative background blobs for visual depth -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
        <div class="absolute -top-40 -left-40 w-80 h-80 bg-white/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-white/10 rounded-full blur-3xl"></div>
    </div>

    <!-- Login Card -->
    <main class="relative z-10 w-full max-w-md mx-4" role="main">
        <div class="bg-white rounded-2xl shadow-2xl p-8 sm:p-10 border border-[#EADBCE]">
            <!-- Header / Branding -->
            <div class="text-center mb-8">
                <span class="text-5xl" aria-hidden="true">🏛️</span>
                <h1 class="text-2xl font-bold text-[#3D2614] mt-3">Welcome Back</h1>
                <p class="text-stone-500 text-sm mt-1">Sign in to your CivicEvents account</p>
            </div>

            <!-- Global error alert (hidden by default) -->
            <div id="login-error"
                 class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm flex items-center gap-2"
                 role="alert" aria-live="polite">
                <span class="font-bold text-base">✕</span>
                <span id="login-error-msg"></span>
            </div>

            <!-- Login Form -->
            <form id="login-form" novalidate aria-label="Sign in form">
                <!-- Email field -->
                <div class="mb-5">
                    <label for="email" class="block text-sm font-medium text-[#4A2E18] mb-1">
                        Email Address
                    </label>
                    <input
                        id="email"
                        type="email"
                        required
                        autocomplete="email"
                        placeholder="you@example.com"
                        aria-describedby="email-err"
                        class="w-full px-4 py-2.5 border border-stone-300 rounded-lg focus:ring-2 focus:ring-[#8B5A2B] focus:border-[#8B5A2B] outline-none transition text-sm bg-white"
                    />
                    <p id="email-err" class="hidden text-red-600 text-xs mt-1" role="alert"></p>
                </div>

                <!-- Password field -->
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-[#4A2E18] mb-1">
                        Password
                    </label>
                    <div class="relative">
                        <input
                            id="password"
                            type="password"
                            required
                            autocomplete="current-password"
                            placeholder="••••••••"
                            aria-describedby="password-err"
                            class="w-full px-4 py-2.5 border border-stone-300 rounded-lg focus:ring-2 focus:ring-[#8B5A2B] focus:border-[#8B5A2B] outline-none transition text-sm pr-11 bg-white"
                        />
                        <!-- Toggle password visibility -->
                        <button
                            type="button"
                            id="toggle-password"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition"
                            aria-label="Toggle password visibility"
                        >
                            <svg id="eye-open" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            <svg id="eye-closed" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 012.223-3.592M6.7 6.7A9.98 9.98 0 0112 5c4.478 0 8.268 2.943 9.542 7a9.97 9.97 0 01-4.043 5.206M6.7 6.7L3 3m3.7 3.7l3.593 3.593M17.3 17.3L21 21m-3.7-3.7l-3.593-3.593M17.3 17.3l-3.593-3.593a3 3 0 00-4.114-4.114L6.7 6.7"/>
                            </svg>
                        </button>
                    </div>
                    <p id="password-err" class="hidden text-red-600 text-xs mt-1" role="alert"></p>
                </div>

                <!-- Submit button -->
                <button
                    type="submit"
                    id="login-btn"
                    class="w-full py-2.5 bg-[#7B4B28] hover:bg-[#5C3618] text-white font-semibold rounded-lg transition focus:ring-2 focus:ring-offset-2 focus:ring-[#8B5A2B] shadow-md disabled:opacity-50 disabled:cursor-not-allowed text-sm"
                >
                    Sign In
                </button>
            </form>

            <!-- Link to signup -->
            <p class="text-center text-sm text-stone-500 mt-6">
                Don't have an account?
                <a href="signup.html" class="text-[#7B4B28] hover:text-[#5C3618] font-bold transition">
                    Create one
                </a>
            </p>
        </div>

        <!-- Footer branding -->
        <p class="text-center text-white/60 text-xs mt-6">
            &copy; <span id="copy-year"></span> CivicEvents. All rights reserved.
        </p>
    </main>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script>
    $(function () {
        /*
         * PUBLIC PAGE — Redirect Guard
         * If the user is already authenticated, redirect to dashboard
         * immediately so they don't see the login form again.
         */
        if (Auth.isLoggedIn()) {
            window.location.href = 'dashboard.html';
            return;
        }

        // Set copyright year
        $('#copy-year').text(new Date().getFullYear());

        // ---- Toggle password visibility ----
        $('#toggle-password').on('click', function () {
            const $input = $('#password');
            const isPassword = $input.attr('type') === 'password';
            $input.attr('type', isPassword ? 'text' : 'password');
            $('#eye-open').toggleClass('hidden', !isPassword);
            $('#eye-closed').toggleClass('hidden', isPassword);
        });

        // ---- Client-side field validation helpers ----
        function validateEmail(email) {
            if (!email) return 'Email is required.';
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return 'Please enter a valid email address.';
            return '';
        }

        function validatePassword(password) {
            if (!password) return 'Password is required.';
            return '';
        }

        function showFieldError(id, msg) {
            $(`#${id}`).text(msg).removeClass('hidden');
        }

        function clearFieldErrors() {
            $('#email-err, #password-err').addClass('hidden').text('');
            $('#login-error').addClass('hidden');
        }

        // ---- Form submission ----
        $('#login-form').on('submit', async function (e) {
            e.preventDefault();
            clearFieldErrors();

            const email = $('#email').val().trim();
            const password = $('#password').val();

            // Client-side validation
            let hasError = false;
            const emailErr = validateEmail(email);
            const passErr  = validatePassword(password);

            if (emailErr) { showFieldError('email-err', emailErr); hasError = true; }
            if (passErr)  { showFieldError('password-err', passErr); hasError = true; }
            if (hasError) return;

            // Disable button and show loading state
            const $btn = $('#login-btn');
            $btn.prop('disabled', true).text('Signing in…');

            try {
                /*
                 * API Call — POST /auth/login
                 * Sends email and password to the backend.
                 * On success, the backend returns { data: { token, user } }.
                 * The user object includes { id, full_name, email, role }.
                 *
                 * ROLE-BASED ACCESS NOTE:
                 * The user's role ("admin" or "user") is determined entirely
                 * by the backend. The frontend simply stores whatever the
                 * backend returns and uses it for UI-level access control.
                 */
                const res = await Api.post('/auth/login', { email, password });

                if (res && res.data) {
                    // Store authentication state
                    Auth.setToken(res.data.token);
                    Auth.setUser(res.data.user);

                    // Redirect to dashboard
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                /*
                 * Error Handling — 4xx / 5xx responses
                 * Display a human-readable error message from the backend.
                 * Common cases: 401 (invalid credentials), 404 (user not found),
                 * 500 (server error).
                 */
                const message = (err && err.message) ? err.message : 'Login failed. Please try again.';
                $('#login-error-msg').text(message);
                $('#login-error').removeClass('hidden');
            } finally {
                $btn.prop('disabled', false).text('Sign In');
            }
        });

        // Show success toast if redirected from signup
        const params = new URLSearchParams(window.location.search);
        if (params.get('registered') === 'true') {
            Toast.show('Account created successfully! Please sign in.', 'success');
        }
    });
    </script>
</body>
</html>
