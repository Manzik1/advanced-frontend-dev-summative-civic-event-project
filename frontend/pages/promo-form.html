<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Promo Video — CivicEvents</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FDFBF7] min-h-screen flex flex-col">

    <div id="navbar-container"></div>

    <main class="flex-1 max-w-2xl mx-auto w-full px-4 py-8" role="main">

        <a href="promos.html" class="inline-flex items-center gap-1.5 text-sm font-semibold text-[#7B4B28] hover:text-[#5C3618] mb-6 transition">
            <span>&larr;</span> Back to Promos
        </a>

        <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-10 border border-[#EADBCE]">
            <div class="mb-6 border-b border-[#EADBCE] pb-4">
                <span class="text-xs uppercase tracking-wider font-extrabold bg-[#D4A373] text-[#2E1A0C] px-2.5 py-1 rounded">Admin Action</span>
                <h1 id="form-heading" class="text-2xl sm:text-3xl font-extrabold text-[#3D2614] mt-2">Upload Promotional Video</h1>
                <p class="text-stone-500 text-sm mt-1">Publish an accessible video highlight with closed captions</p>
            </div>

            <div id="form-error" class="hidden mb-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm flex items-center gap-2" role="alert">
                <span class="font-bold">✕</span>
                <span id="form-error-msg"></span>
            </div>

            <form id="promo-form" class="space-y-6" novalidate>
                <!-- Title -->
                <div>
                    <label for="promo-title" class="block text-sm font-semibold text-[#4A2E18] mb-1">Promo Title *</label>
                    <input id="promo-title" type="text" required placeholder="e.g. City Summer Youth Internship Program"
                           class="w-full px-4 py-2.5 border border-stone-300 rounded-lg text-sm focus:ring-2 focus:ring-[#8B5A2B] outline-none bg-white">
                </div>

                <!-- Description -->
                <div>
                    <label for="promo-description" class="block text-sm font-semibold text-[#4A2E18] mb-1">Description *</label>
                    <textarea id="promo-description" rows="3" required placeholder="Brief summary of the video content..."
                              class="w-full px-4 py-2.5 border border-stone-300 rounded-lg text-sm focus:ring-2 focus:ring-[#8B5A2B] outline-none bg-white"></textarea>
                </div>

                <!-- Closed Captions / Transcript -->
                <div>
                    <label for="promo-caption" class="block text-sm font-semibold text-[#4A2E18] mb-1">Closed Captions / Transcript *</label>
                    <p class="text-xs text-stone-500 mb-2">Required for accessibility so deaf/hard-of-hearing residents can read subtitles.</p>
                    <textarea id="promo-caption" rows="3" required placeholder="Full transcript or subtitle text of the video..."
                              class="w-full px-4 py-2.5 border border-stone-300 rounded-lg text-sm focus:ring-2 focus:ring-[#8B5A2B] outline-none bg-white"></textarea>
                </div>

                <!-- Video Upload -->
                <div>
                    <label for="promo-video" class="block text-sm font-semibold text-[#4A2E18] mb-1">
                        Video File <span id="video-required-label">*</span>
                    </label>
                    <p class="text-xs text-stone-500 mb-2">Supported formats: MP4, MOV, AVI, MKV. Max file size: 8 MB.</p>
                    <input id="promo-video" type="file" accept="video/mp4,video/quicktime,video/x-msvideo,video/x-matroska"
                           class="block w-full text-sm text-stone-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-[#F5EBE0] file:text-[#5C3618] hover:file:bg-[#EADBCE] cursor-pointer">

                    <!-- Video Preview Container -->
                    <div id="video-preview-container" class="hidden mt-3">
                        <p class="text-xs font-semibold text-[#5C3618] mb-1">Video Preview:</p>
                        <video id="video-preview" controls class="w-full max-w-md rounded-xl aspect-video bg-black"></video>
                    </div>
                </div>

                <!-- Submit / Cancel -->
                <div class="flex items-center justify-end gap-3 pt-4 border-t border-[#EADBCE]">
                    <a href="promos.html" class="px-5 py-2.5 rounded-lg border border-stone-300 text-stone-700 text-sm font-semibold hover:bg-[#FAF5F0] transition">Cancel</a>
                    <button type="submit" id="save-btn" class="px-6 py-2.5 rounded-lg bg-[#7B4B28] hover:bg-[#5C3618] text-white text-sm font-semibold shadow transition">
                        Save Promo
                    </button>
                </div>
            </form>
        </div>

    </main>

    <div id="footer-container"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>

    <script>
    /*
     * ======================================================================
     * ROLE-BASED ACCESS GUARD — ADMIN-ONLY PAGE
     * ======================================================================
     * Auth.requireAdmin():
     * Prevents normal users from accessing this promo management form.
     * Only admins can upload, edit, or remove videos.
     * ======================================================================
     */
    $(document).ready(async function () {
        if (!Auth.requireAdmin()) return;

        renderNavbar();
        renderFooter();

        const urlParams = new URLSearchParams(window.location.search);
        const promoId = urlParams.get('id');
        const isEditMode = !!promoId;

        if (isEditMode) {
            $('#form-heading').text('Edit Promo Video');
            $('#save-btn').text('Update Promo');
            $('#video-required-label').text('(Optional if keeping existing video)');
            await loadPromoData(promoId);
        }

        // Live video validation and preview
        $('#promo-video').on('change', function () {
            const file = this.files[0];
            if (!file) {
                $('#video-preview-container').addClass('hidden');
                return;
            }

            // Max file size 8MB
            if (file.size > 8 * 1024 * 1024) {
                Toast.show('Video file too large! Maximum limit is 8MB.', 'error');
                $(this).val('');
                $('#video-preview-container').addClass('hidden');
                return;
            }

            const validExts = ['video/mp4', 'video/quicktime', 'video/x-msvideo', 'video/x-matroska'];
            if (!validExts.includes(file.type) && !/\.(mp4|mov|avi|mkv)$/i.test(file.name)) {
                Toast.show('Invalid video format! Only MP4, MOV, AVI, and MKV allowed.', 'error');
                $(this).val('');
                $('#video-preview-container').addClass('hidden');
                return;
            }

            const objectUrl = URL.createObjectURL(file);
            $('#video-preview').attr('src', objectUrl);
            $('#video-preview-container').removeClass('hidden');
        });

        async function loadPromoData(id) {
            try {
                const res = await Api.get(`/promos/${id}`);
                const data = res.data;
                $('#promo-title').val(data.title || '');
                $('#promo-description').val(data.description || '');
                $('#promo-caption').val(data.caption_text || '');

                if (data.video_url) {
                    $('#video-preview').attr('src', data.video_url);
                    $('#video-preview-container').removeClass('hidden');
                }
            } catch (err) {
                Toast.show('Failed to load promo details.', 'error');
            }
        }

        $('#promo-form').on('submit', async function (e) {
            e.preventDefault();
            $('#form-error').addClass('hidden');

            const title = $('#promo-title').val().trim();
            const description = $('#promo-description').val().trim();
            const caption_text = $('#promo-caption').val().trim();
            const videoFile = $('#promo-video')[0].files[0];

            if (!title || !description || !caption_text) {
                $('#form-error-msg').text('Title, description, and captions are all required.');
                $('#form-error').removeClass('hidden');
                return;
            }

            if (!isEditMode && !videoFile) {
                $('#form-error-msg').text('Please choose a video file to upload.');
                $('#form-error').removeClass('hidden');
                return;
            }

            const $btn = $('#save-btn');
            $btn.prop('disabled', true).text('Uploading...');

            try {
                const formData = new FormData();
                formData.append('title', title);
                formData.append('description', description);
                formData.append('caption_text', caption_text);
                if (videoFile) {
                    formData.append('video', videoFile);
                }

                if (isEditMode) {
                    await Api.put(`/promos/${promoId}`, formData);
                    Toast.show('Promo updated successfully!', 'success');
                } else {
                    await Api.post('/promos', formData);
                    Toast.show('Promo published & notification broadcasted!', 'success');
                }

                setTimeout(() => {
                    window.location.href = 'promos.html';
                }, 1000);

            } catch (err) {
                $('#form-error-msg').text(err.message || 'Error saving promo.');
                $('#form-error').removeClass('hidden');
                $btn.prop('disabled', false).text(isEditMode ? 'Update Promo' : 'Save Promo');
            }
        });
    });
    </script>
</body>
</html>
